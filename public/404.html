<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found | Stack Manager</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        background: #07111f;
        color: #eef5ff;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        box-sizing: border-box;
      }
      main {
        max-width: 42rem;
      }
      small {
        color: #78aaff;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 {
        margin: 1.25rem 0;
        font-size: clamp(3rem, 10vw, 6rem);
        font-weight: 400;
        line-height: 1.3;
      }
      p {
        color: #9eb0c6;
        font-size: 1.1rem;
        line-height: 1.7;
      }
      a {
        min-height: 48px;
        display: inline-flex;
        align-items: center;
        margin-top: 1rem;
        padding: 0 1.25rem;
        border-radius: 10px;
        background: #2164d6;
        color: white;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #9bc0ff;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <small>404</small>
      <h1>That stack is not here.</h1>
      <p>The page you requested does not exist.</p>
      <a href="/">Back to Stack Manager</a>
    </main>
  </body>
</html>
